name: ci
on:
  push:
    branches: [main, "phase-*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Never runs data:snapshot — Emilia's sites are copied once, by hand (docs/05).
      - run: pnpm test
      - run: pnpm typecheck
